# Подключение к MySQL
# Локально по умолчанию используется localhost. В облаке (Render и т.п.) задавайте
# DB_HOST/DB_PORT/DB_NAME/DB_PASSWORD через переменные окружения, не редактируя этот файл.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartpharma_java}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:this-is-a-very-long-secret-key-for-smartpharma-project-do-not-use-in-production}
jwt.expiration=900000

# ML service (predictive orders)
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Email notifications (order sent to supplier). Set MAIL_USERNAME/MAIL_PASSWORD
# via environment variables (e.g. a Gmail account + App Password) - never here.
# If unset, sends are skipped and logged instead of failing order creation.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS: comma-separated list of allowed frontend origins
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}
