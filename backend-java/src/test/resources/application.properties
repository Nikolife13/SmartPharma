# Overrides src/main/resources/application.properties for @SpringBootTest runs.
# Points at an in-memory H2 database (MySQL-compatibility mode) instead of a
# live MySQL, so integration tests boot the real Spring context - real
# SecurityConfig, real JwtAuthenticationFilter, real JPA entities - and are
# still fast and self-contained (no external services required).
spring.datasource.url=jdbc:h2:mem:smartpharma_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

server.port=0

jwt.secret=test-only-secret-key-not-used-anywhere-else-do-not-reuse-in-production
jwt.expiration=900000

ml.service.url=http://localhost:8000

spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=
spring.mail.password=

allowed.origins=http://localhost:5173
